services:
  postgres:
    image: postgres:18-alpine
    container_name: studynest-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: studynest
      POSTGRES_PASSWORD: studynest
      POSTGRES_DB: studynest
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - studynest-data:/var/lib/postgresql
      - ./server/scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studynest -d studynest"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  studynest-data:
